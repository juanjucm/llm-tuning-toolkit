name: Real engine benchmark

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test (empty = the branch selected above)"
        required: false
        type: string
      flavor:
        description: "HF Jobs hardware"
        required: true
        default: a10g-small
        type: choice
        options:
          - a10g-small
          - a10g-large
          - l4x1
          - l40sx1
          - a100-large
          - h200
      model:
        description: "Model to serve with vLLM"
        required: true
        default: Qwen/Qwen3-0.6B
        type: string
      max_tokens:
        description: "Output token cap (text datasets have no output lengths)"
        required: true
        default: "256"
        type: string
      max_model_len:
        description: "vLLM --max-model-len for the served model"
        required: false
        default: "8192"
        type: string
      results_repo:
        description: "HF dataset repo to receive benchmark JSON (empty = discard)"
        required: false
        type: string
      namespace:
        description: "HF namespace to bill and own the job (empty = token owner)"
        required: false
        type: string

concurrency:
  group: real-engine-${{ inputs.pr || github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - name: Check credentials
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is required to dispatch HF Jobs."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run benchmark on HF Jobs
        env:
          FLAVOR: ${{ inputs.flavor }}
          MODEL: ${{ inputs.model }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          MAX_MODEL_LEN: ${{ inputs.max_model_len }}
          NAMESPACE: ${{ inputs.namespace }}
          RESULTS_REPO: ${{ inputs.results_repo }}
        run: |
          namespace_args=()
          if [ -n "$NAMESPACE" ]; then
            namespace_args=(--namespace "$NAMESPACE")
          fi
          # Worst case: 900 s vLLM readiness plus four benchmarks capped at
          # 1800 s each. --secrets forwards the token into the job itself, so
          # gated models, the ShareGPT fetch and the results upload all work.
          uv tool run --from 'huggingface_hub[cli]>=1.16.0,<2.0' hf jobs uv run \
            --flavor "$FLAVOR" \
            --timeout 150m \
            --secrets HF_TOKEN \
            -e MODEL="$MODEL" \
            -e MAX_TOKENS="$MAX_TOKENS" \
            -e MAX_MODEL_LEN="$MAX_MODEL_LEN" \
            -e RESULTS_REPO="$RESULTS_REPO" \
            "${namespace_args[@]}" \
            tests/jobs/real_engine_job.py
