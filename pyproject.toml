[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tuning-toolkit"
version = "0.1.0"
description = "Toolkit for automatic tuning of LLM serving configurations."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aiofiles==23.2.1",
    "annotated-types==0.7.0",
    "anyio==4.9.0",
    "certifi==2025.1.31",
    "cffi==1.17.1",
    "charset-normalizer==3.4.1",
    "click~=8.4.0",
    "coloredlogs>=15.0.1",
    "contourpy==1.3.1",
    "cryptography==44.0.2",
    "cycler==0.12.1",
    "deprecated==1.2.18",
    "docker>=7.1.0",
    "events==0.5",
    "fastapi==0.141.1",
    "ffmpy==0.5.0",
    "filelock==3.18.0",
    "fonttools==4.56.0",
    "fsspec==2025.3.0",
    "gradio==6.25.0",
    "gradio-client==2.6.0",
    # `vision` is required by the synthetic_image / synthetic_video data kinds.
    "guidellm[recommended,vision]==0.7.3",
    "groovy==0.1.2",
    "h11==0.14.0",
    "httpcore==1.0.7",
    "httpx==0.28.1",
    "huggingface-hub>=1.16.0,<2.0",
    "idna==3.10",
    "jinja2==3.1.6",
    "kiwisolver==1.4.8",
    "markdown-it-py==3.0.0",
    "markupsafe==2.1.5",
    "mdurl==0.1.2",
    "numpy==2.2.4",
    "orjson==3.10.16",
    "packaging==24.2",
    "pandas==2.2.3",
    "pillow==10.4.0",
    "pyarrow>=21.0.0,<27.0.0",
    "pycparser==2.22",
    "pydantic>=2.11.7,<3.0",
    "pydub==0.25.1",
    "pygments==2.19.1",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.20",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "rich==13.9.4",
    "safehttpx>=0.1.7,<0.2.0",
    "semantic-version==2.10.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sniffio==1.3.1",
    "starlette==1.6.0",
    "tomlkit==0.12.0",
    "trackio==0.35.0",
    "tqdm==4.67.1",
    "typer==0.26.0",
    "typing-extensions>=4.15.0,<5.0",
    "tzdata==2025.2",
    "urllib3==2.3.0",
    "uvicorn==0.34.0",
    "websockets>=13.0,<18.0",
]

[project.scripts]
auto-tune = "auto_tune.cli:main"
recipe-benchmark = "auto_tune.benchmarking.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: run real GuideLLM against its mock server (slow, needs network, Linux only)",
]

[tool.ruff]
line-length = 112

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = false
